<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Partisipasi & Karya - LDMI Al-Fajr</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sembunyikan { display: none !important; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo LDMI Al-Fajr" class="logo-img">
        <h1>Lembaga Dakwah Mahasiswa Islam (LDMI) Al-Fajr</h1>
    </header>
    <nav>
        <a href="organisasi.html">Organisasi & Struktur</a>
        <a href="kegiatan.html">Kegiatan & Karya</a>
        <a href="layanan.html">Portal Layanan</a>
    </nav>

    <main class="grid-container">
        <section class="kartu">
            <h2>Formulir Partisipasi Event & Penyetoran Karya</h2>
            <form id="formKarya">
                <div class="grup-input">
                    <label for="namaPengirim">Nama Lengkap:</label>
                    <input type="text" id="namaPengirim" required>
                </div>

                <div class="grup-input">
                    <label for="nimPengirim">NIM:</label>
                    <input type="number" id="nimPengirim" required>
                </div>

                <div class="grup-input">
                    <label for="kategoriInput">Kategori Keperluan:</label>
                    <select id="kategoriInput" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="event">Daftar Event / Kegiatan</option>
                        <option value="tulisan">Kirim Karya Tulisan (Artikel/Opini)</option>
                        <option value="video">Kirim Karya Desain / Video</option>
                    </select>
                </div>

                <div id="blokDaftarEvent" class="grup-input semunyikan">
                    <label for="pilihEvent">Pilih Kegiatan yang Diikuti:</label>
                    <select id="pilihEvent">
                        <option value="public-speaking">Public Speaking Class</option>
                        <option value="mabit">MABIT Semester Ganjil</option>
                        <option value="media-class">Creative Media Class</option>
                    </select>
                </div>

                <div id="blokKaryaTulisan" class="grup-input semunyikan">
                    <label for="judulKarya">Judul Tulisan:</label>
                    <input type="text" id="judulKarya" placeholder="Judul artikel atau essay">
                    <label for="fileDokumen">Upload Dokumen (PDF/DOCX):</label>
                    <input type="file" id="fileDokumen">
                </div>

                <div id="blokKaryaVideo" class="grup-input semunyikan">
                    <label for="urlKarya">Link Google Drive / YouTube Karya:</label>
                    <input type="url" id="urlKarya" placeholder="https://...">
                </div>

                <div id="previewArea" style="margin-top: 15px; padding: 10px; border: 1px dashed #999; display:none;">
                    <h4>Pratinjau Pengiriman:</h4>
                    <p id="teksPreview">-</p>
                </div>

                <br>
                <button type="submit" class="tombol-submit">Kirim Data</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 LDMI Al-Fajr UIN Mataram</p>
    </footer>
