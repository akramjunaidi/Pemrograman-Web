<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Terpadu Bidang - LDMI Al-Fajr</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .sembunyikan { display: none !important; }
        .nonaktif { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo LDMI Al-Fajr" class="logo-img">
        <h1>Lembaga Dakwah Mahasiswa Islam (LDMI) Al-Fajr</h1>
    </header>
    <nav>
        <a href="organisasi.html">Organisasi & Struktur</a>
        <a href="kegiatan.html">Kegiatan & Karya</a>
        <a href="layanan.html">Portal Layanan</a>
    </nav>

    <main class="grid-container">
        <section class="kartu">
            <h2>Portal Terpadu Bidang</h2>
            <p>Pusat layanan, evaluasi, dan aspirasi anggota LDMI Al-Fajr.</p>
            
            <form id="formTerpadu">
                <fieldset>
                    <legend>Identitas Pengirim</legend>
                    <div class="grup-input">
                        <label><input type="checkbox" id="cekAnonim"> Sembunyikan identitas saya (Kirim sebagai Anonim)</label>
                    </div>
                    <div class="grup-input" id="blokIdentitas">
                        <label for="inputNama">Nama Lengkap:</label>
                        <input type="text" id="inputNama" placeholder="Masukkan Nama Lengkap">
                        
                        <label for="inputNIM">NIM:</label>
                        <input type="number" id="inputNIM" placeholder="Masukkan NIM">
                    </div>
                    <div class="grup-input">
                        <label for="pilihBidang">Bidang Tujuan:</label>
                        <select id="pilihBidang" required>
                            <option value="">-- Pilih Departemen --</option>
                            <option value="kaderisasi">Departemen Kaderisasi</option>
                            <option value="humas">Departemen Humas</option>
                            <option value="kajian">Departemen Kajian & Keilmuan</option>
                            <option value="keputrian">Departemen Keputrian</option>
                            <option value="danus">Departemen Dana dan Usaha</option>
                            <option value="media">Departemen Media</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Pilih Jenis Interaksi</legend>
                    <div class="grup-radio">
                        <label><input type="radio" name="interaksi" value="layanan"> Request Layanan Bidang</label>
                        <label><input type="radio" name="interaksi" value="evaluasi"> Evaluasi & Penilaian Kinerja</label>
                        <label><input type="radio" name="interaksi" value="aspirasi"> Ajukan Ide / Aspirasi Baru</label>
                    </div>
                </fieldset>

                <fieldset id="areaDinamis">
                    <legend>Detail Formulir</legend>
                    
                    <div id="blokLayanan" class="blok-form sembunyikan">
                        <label for="opsiLayanan">Jenis Layanan Spesifik:</label>
                        <select id="opsiLayanan">
                            <option value="">-- Silakan pilih Bidang Tujuan di atas terlebih dahulu --</option>
                        </select>
                    </div>

                    <div id="blokEvaluasi" class="blok-form sembunyikan">
                        <label>Berikan Rating:</label>
                        <div id="ratingBintang" style="font-size: 24px; cursor: pointer;">☆ ☆ ☆ ☆ ☆</div>
                        <label for="inputEvaluasi">Ulasan & Kritik Membangun:</label>
                        <textarea id="inputEvaluasi" rows="4" placeholder="Tuliskan evaluasi Anda di sini..."></textarea>
                    </div>

                    <div id="blokAspirasi" class="blok-form sembunyikan">
                        <label for="judulIde">Judul Gagasan / Ide Proker:</label>
                        <input type="text" id="judulIde" placeholder="Contoh: Pembuatan Website LDMI">
                        
                        <label for="deskripsiIde">Deskripsi Lengkap (<span id="sisaKarakter">300</span> karakter tersisa):</label>
                        <textarea id="deskripsiIde" rows="4" maxlength="300" placeholder="Jelaskan gagasanmu selengkap mungkin..."></textarea>
                    </div>
                </fieldset>

                <button type="submit" class="tombol-submit">Kirim Formulir</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 LDMI Al-Fajr UIN Mataram</p>
    </footer>

    <script src="layanan.js"></script>
</body>
</html>
