<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Partisipasi & Karya - LDMI Al-Fajr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo LDMI Al-Fajr" class="logo-img">
        <h1>Lembaga Dakwah Mahasiswa Islam (LDMI) Al-Fajr</h1>
    </header>
    <nav>
        <a href="organisasi.html">Organisasi & Struktur</a>
        <a href="kegiatan.html" class="active">Kegiatan & Karya</a>
        <a href="layanan.html">Portal Layanan</a>
    </nav>

    <main class="grid-container">
        <section class="kartu">
            <h2>Formulir Partisipasi Event & Penyetoran Karya</h2>
            <p style="margin-bottom: 15px;">Daftarkan partisipasi kegiatan atau setorkan karya tulis dan media dakwah Anda.</p>

            <!-- Kontainer Pesan Validasi JavaScript -->
            <div id="pesanError" class="kotak-error sembunyikan"></div>

            <form id="formKarya" novalidate>
                <div class="grup-input">
                    <label for="namaPengirim">Nama Lengkap: <span style="color:red;">*</span></label>
                    <input type="text" id="namaPengirim" placeholder="Masukkan nama lengkap">
                </div>

                <div class="grup-input">
                    <label for="nimPengirim">NIM: <span style="color:red;">*</span></label>
                    <input type="number" id="nimPengirim" placeholder="Masukkan NIM (contoh: 250306055)">
                </div>

                <div class="grup-input">
                    <label for="kategoriInput">Kategori Keperluan: <span style="color:red;">*</span></label>
                    <select id="kategoriInput">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="event">Daftar Event / Kegiatan</option>
                        <option value="tulisan">Kirim Karya Tulisan (Artikel/Opini)</option>
                        <option value="video">Kirim Karya Desain / Video</option>
                    </select>
                </div>

                <div id="blokDaftarEvent" class="grup-input sembunyikan">
                    <label for="pilihEvent">Pilih Kegiatan yang Diikuti: <span style="color:red;">*</span></label>
                    <select id="pilihEvent">
                        <option value="public-speaking">Public Speaking Class</option>
                        <option value="mabit">MABIT Semester Ganjil</option>
                        <option value="media-class">Creative Media Class</option>
                    </select>
                </div>

                <div id="blokKaryaTulisan" class="grup-input sembunyikan">
                    <label for="judulKarya">Judul Tulisan: <span style="color:red;">*</span></label>
                    <input type="text" id="judulKarya" placeholder="Judul artikel atau essay">
                    
                    <label for="fileDokumen" style="margin-top: 10px;">Upload Dokumen (PDF/DOCX): <span style="color:red;">*</span></label>
                    <input type="file" id="fileDokumen" accept=".pdf,.doc,.docx">
                </div>

                <div id="blokKaryaVideo" class="grup-input sembunyikan">
                    <label for="urlKarya">Link Google Drive / YouTube Karya: <span style="color:red;">*</span></label>
                    <input type="url" id="urlKarya" placeholder="https://...">
                </div>

                <div id="previewArea" class="box-preview sembunyikan">
                    <h4>Pratinjau Pengiriman:</h4>
                    <p id="teksPreview">-</p>
                </div>

                <br>
                <button type="submit" class="tombol-submit">Kirim Data</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 LDMI Al-Fajr UIN Mataram</p>
    </footer>

    <script src="karya.js"></script>
</body>
</html>
