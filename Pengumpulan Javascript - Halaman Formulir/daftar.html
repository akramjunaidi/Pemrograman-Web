<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota - LDMI Al-Fajr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo LDMI Al-Fajr" class="logo-img">
        <h1>Lembaga Dakwah Mahasiswa Islam (LDMI) Al-Fajr</h1>
    </header>
    <nav>
        <a href="organisasi.html">Organisasi & Struktur</a>
        <a href="kegiatan.html">Kegiatan & Karya</a>
        <a href="layanan.html">Portal Layanan</a>
    </nav>

    <main class="grid-container">
        <section class="kartu">
            <h2>Formulir Open Recruitment Anggota Baru</h2>
            <p style="margin-bottom: 15px;">Lengkapi seluruh data diri berikut untuk mendaftar sebagai kader LDMI Al-Fajr.</p>

            <!-- Kontainer Pesan Validasi JavaScript -->
            <div id="pesanError" class="kotak-error sembunyikan"></div>

            <form id="formPendaftaran" novalidate>
                <div class="grup-input">
                    <label for="namaLengkap">Nama Lengkap: <span style="color:red;">*</span></label>
                    <input type="text" id="namaLengkap" placeholder="Masukkan nama lengkap">
                </div>

                <div class="grup-input">
                    <label for="nimAnggota">NIM: <span style="color:red;">*</span></label>
                    <input type="number" id="nimAnggota" placeholder="Masukkan NIM (contoh: 250306047)">
                </div>

                <div class="grup-input">
                    <label for="prodiAnggota">Fakultas / Program Studi: <span style="color:red;">*</span></label>
                    <select id="prodiAnggota">
                        <option value="">-- Pilih Prodi --</option>
                        <option value="TI">Teknologi Informasi</option>
                        <option value="PAI">Pendidikan Agama Islam</option>
                        <option value="IQT">Ilmu Al-Qur'an dan Tafsir</option>
                        <option value="KPI">Komunikasi dan Penyiaran Islam</option>
                    </select>
                </div>

                <div class="grup-input">
                    <label for="emailAnggota">Email: <span style="color:red;">*</span></label>
                    <input type="email" id="emailAnggota" placeholder="contoh@gmail.com">
                </div>

                <div class="grup-input">
                    <label for="waAnggota">Nomor WhatsApp: <span style="color:red;">*</span></label>
                    <input type="tel" id="waAnggota" placeholder="08xxxxxxxxxx">
                </div>

                <div class="grup-input">
                    <label for="motivasi">Motivasi Bergabung (<span id="sisaKarakterMotivasi">200</span> karakter tersisa): <span style="color:red;">*</span></label>
                    <textarea id="motivasi" rows="4" maxlength="200" placeholder="Tuliskan alasan Anda bergabung..."></textarea>
                </div>

                <button type="submit" class="tombol-submit">Kirim Pendaftaran</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 LDMI Al-Fajr UIN Mataram</p>
    </footer>

    <script src="daftar.js"></script>
</body>
</html>
